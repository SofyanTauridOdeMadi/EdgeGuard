<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge Guard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(160deg,#1e3a8a 0%,#1e40af 55%,#3730a3 100%);
  color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);border-radius:24px;
  max-width:420px;width:100%;padding:36px 28px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ico{font-size:64px;margin-bottom:14px;line-height:1}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
.sub{font-size:14px;color:#c7d2fe;line-height:1.55;margin-bottom:22px}
.dom{background:rgba(0,0,0,.25);border-radius:12px;padding:12px 16px;
  font-family:'SF Mono',Menlo,monospace;font-size:15px;font-weight:600;
  word-break:break-all;margin-bottom:8px;border:1px solid rgba(255,255,255,.1)}
.tag{display:inline-block;font-size:11px;font-weight:700;
  padding:4px 12px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:22px}
.tag-merah{background:#ef4444;color:#fff}
.tag-kuning{background:#f59e0b;color:#fff}
.tag-hijau{background:#10b981;color:#fff}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;
  font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;
  transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn-primary{background:#fff;color:#1e40af}
.btn-primary:hover{opacity:.92}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.msg{font-size:13px;margin-top:16px;min-height:18px;font-weight:500}
.msg.ok{color:#86efac}
.msg.err{color:#fca5a5}
.foot{margin-top:26px;font-size:12px;color:#a5b4fc;line-height:1.5}
.foot b{color:#e0e7ff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.info-box{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;
  margin-bottom:18px;font-size:13px;line-height:1.6;color:#e0e7ff;text-align:left}
.info-box strong{color:#fff}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="ico" id="ico">⏳</div>
    <h1 id="judul">Memuat…</h1>
    <p class="sub" id="sub">Memeriksa status koneksi…</p>
    <div class="dom" id="domain" style="display:none"></div>
    <span class="tag tag-merah" id="tag" style="display:none"></span>
    <div class="info-box" id="info-box" style="display:none"></div>
    <div id="btns"></div>
    <div class="msg" id="msg"></div>
    <div class="foot">Dilindungi oleh <b>Edge Guard</b> · Parental Control</div>
  </div>

<script>
var PORTAL = 'http://192.168.1.1:8880';
var domain = location.hostname || '';
if (domain.indexOf('www.') === 0) domain = domain.slice(4);

// Apakah ini sinkhole redirect? Domain di address bar bukan IP router/portal
function isIP(h) { return /^\d{1,3}(\.\d{1,3}){3}$/.test(h); }
var looksLikeSinkhole = domain && !isIP(domain);

function tampilNegatif(dom) {
  document.getElementById('ico').textContent = '🚫';
  document.getElementById('judul').textContent = 'Situs Diblokir';
  document.getElementById('sub').textContent =
    'Situs ini mengandung konten yang tidak diizinkan oleh orang tua kamu.';
  var domEl = document.getElementById('domain');
  domEl.textContent = dom || domain;
  domEl.style.display = '';
  var tag = document.getElementById('tag');
  tag.textContent = '⛔ Konten Negatif'; tag.className = 'tag tag-merah';
  tag.style.display = '';
  document.getElementById('btns').innerHTML =
    '<button class="btn btn-primary" onclick="mintaIzin()">🙋 Minta Izin ke Orang Tua</button>' +
    '<a class="btn btn-ghost" href="https://www.google.com">← Kembali ke Halaman Aman</a>';
}

function tampilKuota() {
  document.getElementById('ico').textContent = '⏳';
  document.getElementById('judul').textContent = 'Kuota Hiburan Habis';
  document.getElementById('sub').textContent =
    'Jatah waktu hiburan kamu hari ini sudah habis. Belajar dulu untuk dapat bonus waktu, atau minta izin orang tua.';
  var tag = document.getElementById('tag');
  tag.textContent = '⏳ Kuota Habis'; tag.className = 'tag tag-kuning';
  tag.style.display = '';
  document.getElementById('btns').innerHTML =
    '<button class="btn btn-primary" onclick="mintaIzin()">🙋 Minta Tambah Waktu ke Orang Tua</button>' +
    '<a class="btn btn-ghost" href="https://www.google.com">← Buka Situs Edukasi</a>';
}

function tampilJadwal() {
  document.getElementById('ico').textContent = '🌙';
  document.getElementById('judul').textContent = 'Jam Istirahat Internet';
  document.getElementById('sub').textContent =
    'Sekarang adalah jam istirahat internet. Orang tua telah mengatur jadwal ini untuk kamu.';
  var tag = document.getElementById('tag');
  tag.textContent = '🌙 Jadwal Istirahat'; tag.className = 'tag tag-hijau';
  tag.style.display = '';
  var box = document.getElementById('info-box');
  box.innerHTML = '<strong>Apa yang bisa kamu lakukan?</strong><br>✏️ Kerjakan tugas atau PR<br>📚 Baca buku<br>🎵 Istirahat & relax';
  box.style.display = '';
  document.getElementById('btns').innerHTML =
    '<button class="btn btn-primary" onclick="mintaIzin()">🙋 Minta Izin ke Orang Tua</button>';
}

function tampilJeda() {
  document.getElementById('ico').textContent = '⏸';
  document.getElementById('judul').textContent = 'Internet Dijeda';
  document.getElementById('sub').textContent =
    'Orang tua kamu sedang menjeda akses internet perangkat ini. Hubungi mereka jika ada keperluan penting.';
  var tag = document.getElementById('tag');
  tag.textContent = '⏸ Dijeda Orang Tua'; tag.className = 'tag tag-kuning';
  tag.style.display = '';
  document.getElementById('btns').innerHTML =
    '<button class="btn btn-primary" onclick="mintaIzin()">🙋 Minta Dibuka ke Orang Tua</button>';
}

function mintaIzin() {
  var btn = document.querySelector('#btns .btn-primary');
  var msg = document.getElementById('msg');
  if (btn) btn.disabled = true;
  msg.className = 'msg';
  msg.innerHTML = '<span class="spin"></span>Mengirim permintaan…';

  fetch(PORTAL + '/minta-izin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({domain: domain || location.hostname, perangkat: ''})
  })
  .then(function(r){ return r.json().catch(function(){ return {}; }); })
  .then(function(j){
    msg.className = 'msg ok';
    msg.textContent = '✅ ' + (j.pesan || 'Permintaan terkirim! Tunggu persetujuan orang tua.');
    if (btn) btn.textContent = '✅ Permintaan Terkirim';
  })
  .catch(function(){
    msg.className = 'msg ok';
    msg.textContent = '✅ Permintaan dikirim ke orang tua.';
    if (btn) btn.textContent = '✅ Permintaan Terkirim';
  });
}

// Deteksi alasan blokir — kirim domain (location.hostname) ke /status agar
// portal bisa bedakan: negatif (sinkhole) vs jeda/jadwal/kuota (status VPS).
function init() {
  var url = PORTAL + '/status?domain=' + encodeURIComponent(domain || '');
  fetch(url, {cache: 'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var a = j.alasan || (looksLikeSinkhole ? 'negatif' : 'kuota');
      if      (a === 'jeda')    tampilJeda();
      else if (a === 'jadwal')  tampilJadwal();
      else if (a === 'kuota')   tampilKuota();
      else                      tampilNegatif(j.domain || domain);
    })
    .catch(function(){
      // Gagal hubungi portal → tebak dari bentuk hostname
      if (looksLikeSinkhole) tampilNegatif(domain);
      else                   tampilKuota();
    });
}

init();
</script>
</body>
</html>
